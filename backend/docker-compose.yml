services:
  db:
    image: postgres:18-alpine
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=medicine-store
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    # volumes:
    #   - redis_data:/data

  rustfs:
    image: rustfs/rustfs
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password

volumes:
  # postgres-data:
  redis_data:
  rustfs_data:
